# SCORING (catalogue RC-06, RC-07, RC-09; FRD 6.1). PROPOSED values: the BA must confirm (REVIEW-1).
# The AI never sees these numbers and has no field to write a score. Only code uses them.

# Alert score = the highest hit score. Bands:
#   score <  auto_clear_below      -> AUTO_CLEAR
#   score <  l3_from               -> L2
#   score >= l3_from               -> L3
bands:
  auto_clear_below: 0.35
  l3_from: 0.85

# Name hit score = similarity x corroboration factor. The factor depends on the attribute table (DOB, nationality, city, identifiers).
# Checked against the catalogue: TC-02 gives 1.00 x 0.15 = 0.15 ; TC-06 gives 0.99 x 0.95 = 0.94.
corroboration:
  identifier_match: 1.00           # an identifier is MATCH
  match_no_mismatch: 0.95          # at least one MATCH and no MISMATCH
  match_and_mismatch: 0.60         # mixed
  all_unknown: 0.70                # nothing to compare
  one_mismatch: 0.45               # exactly one MISMATCH, no MATCH
  two_or_more_mismatch: 0.15
  identifier_mismatch: 0.10        # an identifier is MISMATCH

# Location score (RC-07), from the AI's reading of the place (L1-05) and the re-screen result:
location:
  sanctioned_region_true: 0.90
  unrelated_or_street_not_sanctioned: 0.30
  unknown_or_conflicting: 0.55

# Which rule gives which kind of score
name_rules: [S1-R01, S2-R01, S2-R02, S2-R03]            # similarity x corroboration
full_score_rules: [S1-R02, S1-R03, S1-R04, S1-R06, S1-R07]   # score 1.0 (a list or format match)
location_rules: [S2-R04]
other_hit_score: 0.30    # S2-R05, S2-R07, S2-R08, S2-R09, S1-R05: their FLOOR (L2 / G-04) does the work
