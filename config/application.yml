# Copy this file to  application-local.yml  (same folder) and fill it in. application-local.yml is never committed.
# Only write what you want to change; everything else comes from application.yml.

llm:
  provider: openai

embedder: openai            # or leave it as "hash" (offline) if you only want the chat model to be real

openai:
  api_key:                      # your key. For a local server that needs none, any text works (for example "local")
  # base_url: http://localhost:11434/v1 # only for a local OpenAI-compatible server (Ollama / LM Studio); blank = OpenAI cloud
  model_l1: gpt-5          # pin a model you have access to
  model_l2: gpt-5          # was commented out: openai needs both models, so I set it to the same as L1 - change if you want
  embedding_model: "text-embedding-3-large"

langsmith:
  tracing: true
  api_key:                     # from smith.langchain.com -> Settings -> API keys
  agent_id: sanction-ai-agent
  endpoint: https://apac.api.smith.langchain.com
  agent_environment: local
  # hide_inputs: true                   # switch these on if you ever trace real payment text
  # hide_outputs: true
